<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>birdy MEDIA</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#f2f2f2;
}

header{
    background:#222;
    color:white;
    padding:20px;
    text-align:center;
    font-size:30px;
}

nav{
    background:white;
    padding:15px;
    text-align:center;
}

button{
    padding:10px;
    border:none;
    background:#333;
    color:white;
    border-radius:8px;
    cursor:pointer;
    margin:5px;
}

.container{
    width:700px;
    max-width:90%;
    margin:auto;
}


.card{
    background:white;
    padding:20px;
    margin-top:20px;
    border-radius:15px;
}


input, textarea{
    width:90%;
    padding:10px;
    margin:5px;
}


img{
    max-width:100%;
    border-radius:10px;
}


.like{
    background:#1877f2;
}


.disabled{
    background:gray;
}


</style>

</head>


<body>


<header>
birdy MEDIA
</header>


<nav>
<button onclick="showAccount()">Account</button>
<button onclick="showFeed()">Feed</button>
<button onclick="showCreate()">Create Post</button>
</nav>



<div class="container">


<div class="card" id="account">

<h2>Create Account</h2>

<input id="username" placeholder="Username">

<button onclick="createAccount()">
Create
</button>

<p id="profile"></p>

</div>




<div class="card" id="create" style="display:none">

<h2>Create Meme Post</h2>

<textarea id="postText" placeholder="Write a meme caption"></textarea>

<input id="image" placeholder="Meme image URL">


<button onclick="createPost()">
Post
</button>


</div>




<div id="feed">


<div class="card">

<h3>Funny Bird</h3>

<p>When you open your homework and realize it is due tomorrow.</p>

<img src="https://picsum.photos/600/400">


<button class="like" onclick="likePost(this)">
Like
</button>

<p>Likes: <span>0</span></p>

</div>



<div class="card">

<h3>Meme Master</h3>

<p>Me trying to fix my code after one mistake.</p>

<img src="https://picsum.photos/601/400">


<button class="like" onclick="likePost(this)">
Like
</button>

<p>Likes: <span>0</span></p>

</div>


</div>


</div>



<script>


let user =
localStorage.getItem("birdyUser");


if(user){

document.getElementById("profile").innerHTML =
"Logged in as: " + user;

}



function createAccount(){

let name =
document.getElementById("username").value;


if(name){

localStorage.setItem(
"birdyUser",
name
);


document.getElementById("profile").innerHTML =
"Logged in as: " + name;

}

}



function likePost(button){

if(button.classList.contains("disabled")){
return;
}


let number =
button.parentElement.querySelector("span");


number.innerHTML =
Number(number.innerHTML)+1;


button.classList.add("disabled");

button.innerHTML="Liked";

}



function createPost(){

let text =
document.getElementById("postText").value;


let image =
document.getElementById("image").value;


let name =
localStorage.getItem("birdyUser") || "Unknown User";


let post =
document.createElement("div");


post.className="card";


post.innerHTML=

`
<h3>${name}</h3>
<p>${text}</p>
<img src="${image}">
<br>
<button class="like" onclick="likePost(this)">
Like
</button>
<p>Likes: <span>0</span></p>
`;


document.getElementById("feed")
.prepend(post);


}



function showAccount(){

document.getElementById("account").style.display="block";
document.getElementById("create").style.display="none";

}


function showCreate(){

document.getElementById("account").style.display="none";
document.getElementById("create").style.display="block";

}


function showFeed(){

document.getElementById("account").style.display="none";
document.getElementById("create").style.display="none";

}



</script>


</body>
</html>
